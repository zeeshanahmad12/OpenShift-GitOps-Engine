name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]

jobs:
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4

    - name: Update image tag in manifest
      run: bash scripts/update-manifest.sh ${{ github.event.workflow_run.head_sha }}

  smoke-test:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: update-manifest
    steps:
    - uses: actions/checkout@v4

    - name: Wait for ArgoCD sync
      run: sleep 30

    - name: Run smoke test
      run: bash scripts/smoke-test.sh ${{ secrets.STAGING_URL }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: production
    steps:
    - uses: actions/checkout@v4

    - name: Update prod manifest
      run: |
        sed -i "s|IMAGE_TAG|${{ github.event.workflow_run.head_sha }}|g" k8s/overlays/prod/kustomization.yaml
        git config user.email "ci@github.com"
        git config user.name "CI Bot"
        git add k8s/overlays/prod/kustomization.yaml
        git commit -m "deploy: promote to production ${{ github.event.workflow_run.head_sha }}"
        git push
