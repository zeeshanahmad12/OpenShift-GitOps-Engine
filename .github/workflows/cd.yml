name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]

jobs:
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update image tag in manifest
      run: bash scripts/update-manifest.sh ${{ github.event.workflow_run.head_sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: update-manifest
    environment:
      name: production
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update prod manifest
      run: |
        sed -i "s|python-webapp:.*|python-webapp:${{ github.event.workflow_run.head_sha }}|g" k8s/overlays/prod/kustomization.yaml
        git config user.email "ci@github.com"
        git config user.name "CI Bot"
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/zeeshanahmad12/OpenShift-GitOps-Engine.git"
        git add k8s/overlays/prod/kustomization.yaml
        if git diff --cached --quiet; then
          echo "No changes"
          exit 0
        fi
        git commit -m "deploy: promote to production ${{ github.event.workflow_run.head_sha }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
