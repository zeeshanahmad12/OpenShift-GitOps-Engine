name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install flask pylint flake8 yamllint shellcheck-py

    - name: Run pylint
      run: pylint app/ --rcfile=.linting/.pylintrc

    - name: Run flake8
      run: flake8 app/ --config=.linting/.flake8

    - name: Run yamllint
      run: yamllint k8s/ -c .linting/.yamllint

    - name: Run shellcheck
      run: shellcheck scripts/*.sh

  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-latest
    needs: lint
    if: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt

    - name: Run pytest with coverage
      run: pytest --cov=app --cov-report=xml --cov-fail-under=80

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  build-scan-push:
    name: Docker Build Scan and Push
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4

    - name: Set image tag
      run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: docker build -f docker/Dockerfile -t quay.io/${{ secrets.QUAY_USERNAME }}/python-webapp:${{ env.IMAGE_TAG }} .

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: quay.io/${{ secrets.QUAY_USERNAME }}/python-webapp:${{ env.IMAGE_TAG }}
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH

    - name: Login to Quay.io
      run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

    - name: Push image
      run: docker push quay.io/${{ secrets.QUAY_USERNAME }}/python-webapp:${{ env.IMAGE_TAG }}
