apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-webapp-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/python-webapp-cicd-openshift
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: python-webapp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
