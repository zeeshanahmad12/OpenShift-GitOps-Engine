apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: python-webapp-rollout
spec:
  replicas: 3
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 100
  selector:
    matchLabels:
      app: python-webapp
  template:
    metadata:
      labels:
        app: python-webapp
    spec:
      containers:
      - name: python-webapp
        image: quay.io/YOUR_USERNAME/python-webapp:IMAGE_TAG
        ports:
        - containerPort: 8080
